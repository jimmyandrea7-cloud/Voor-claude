<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    .rc-wk * { box-sizing: border-box; }
    .rc-wk a { color: #C9A24B; text-decoration: underline; text-underline-offset: 4px; }
    .rc-wk a:hover { color: #EFC876; }
    .rc-wk-mono { font-family: 'Space Mono', monospace; }
    .rc-wk-btn:hover { background: #DDB661; }
  </style>
</helmet>

<div class="rc-wk" style="width:1440px;height:900px;position:relative;overflow:hidden;background:#1B140F;font-family:'Zilla Slab',serif;color:#EDE3D0;">

  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 900px 700px at 76% 32%, rgba(201,162,75,0.11), transparent 70%);"></div>

  <!-- corner screws -->
  <svg width="1440" height="900" style="position:absolute;inset:0;" viewBox="0 0 1440 900">
    <g stroke="rgba(201,162,75,0.4)" stroke-width="1" fill="none">
      <circle cx="40" cy="40" r="7"/><line x1="35" y1="37" x2="45" y2="43"/>
      <circle cx="1400" cy="40" r="7"/><line x1="1395" y1="43" x2="1405" y2="37"/>
      <circle cx="40" cy="860" r="7"/><line x1="35" y1="857" x2="45" y2="863"/>
      <circle cx="1400" cy="860" r="7"/><line x1="1395" y1="863" x2="1405" y2="857"/>
    </g>
  </svg>

  <!-- eyebrow -->
  <div class="rc-wk-mono" style="position:absolute;left:96px;top:76px;font-size:12px;letter-spacing:0.2em;color:#C9A24B;text-transform:uppercase;">
    On the bench
  </div>

  <div style="position:absolute;left:96px;top:130px;width:560px;">
    <h1 style="margin:0;font-weight:700;font-size:56px;line-height:1.12;color:#F3EAD8;">
      Identification, the way a watchmaker would do it.
    </h1>
    <p style="margin:26px 0 0;font-family:'Space Mono',monospace;font-size:14.5px;line-height:1.75;color:#B7AB93;max-width:460px;">
      Lay the watch under the loupe. We study the case, the dial, the movement — then match what we see against a documented archive of vintage Omega references.
    </p>

    <div style="margin-top:40px;display:flex;align-items:center;gap:24px;">
      <div class="rc-wk-btn" style="display:flex;align-items:center;gap:10px;background:#C9A24B;color:#1B140F;padding:15px 26px;border:1px solid rgba(0,0,0,0.35);box-shadow:0 1px 0 rgba(255,255,255,0.25) inset;">
        <span class="rc-wk-mono" style="font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Begin Identification</span>
        <span style="font-size:15px;">→</span>
      </div>
      <a href="#" class="rc-wk-mono" style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;">Continue with Google</a>
    </div>
  </div>

  <!-- felt tray -->
  <div style="position:absolute;right:78px;top:120px;width:630px;height:660px;background:#23281F;border-radius:6px;box-shadow:inset 0 2px 24px rgba(0,0,0,0.55), 0 20px 50px rgba(0,0,0,0.4);"></div>

  <svg width="630" height="660" style="position:absolute;right:78px;top:120px;" viewBox="0 0 630 660">
    <!-- loupe -->
    <g transform="translate(150,150) rotate(-8)" stroke="#C9A24B" stroke-width="2" fill="none">
      <circle cx="0" cy="0" r="58" />
      <circle cx="0" cy="0" r="46" stroke="rgba(201,162,75,0.5)" stroke-width="1"/>
      <line x1="41" y1="41" x2="98" y2="98" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- pocket watch -->
    <g transform="translate(400,180) rotate(6)">
      <circle cx="0" cy="0" r="82" fill="none" stroke="#EDE3D0" stroke-width="2"/>
      <rect x="-14" y="-100" width="28" height="20" rx="3" fill="none" stroke="#EDE3D0" stroke-width="2"/>
      <circle cx="0" cy="0" r="2.6" fill="#C9A24B"/>
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#EDE3D0" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="28" y2="18" stroke="#EDE3D0" stroke-width="2" stroke-linecap="round"/>
      <g stroke="#8A7960" stroke-width="1.5">
        <line x1="0" y1="-72" x2="0" y2="-64"/>
        <line x1="0" y1="72" x2="0" y2="64"/>
        <line x1="-72" y1="0" x2="-64" y2="0"/>
        <line x1="72" y1="0" x2="64" y2="0"/>
      </g>
    </g>

    <!-- tweezers -->
    <g transform="translate(210,420) rotate(18)" stroke="#C9A24B" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M-6,-120 C-18,-40 -14,20 -2,64"/>
      <path d="M6,-120 C18,-40 14,20 2,64"/>
    </g>

    <!-- screwdriver -->
    <g transform="translate(430,470) rotate(-24)" stroke="#EDE3D0" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="0" y1="-80" x2="0" y2="30"/>
      <rect x="-9" y="30" width="18" height="46" rx="4" fill="#8A7960" stroke="none"/>
    </g>

    <!-- scattered screws -->
    <g fill="#C9A24B">
      <circle cx="300" cy="560" r="4"/>
      <circle cx="330" cy="575" r="4"/>
      <circle cx="270" cy="580" r="4"/>
    </g>
  </svg>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
